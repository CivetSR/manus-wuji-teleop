# 0.0174533 ≈ pi/180 (degrees→radians). If Manus already outputs radians, set scale: 1.0
notes: |
  Finger order on wire: thumb,index,middle,ring,pinky.
  Wuji index = finger_index * 4 + joint_index.
  Tune bias so open-hand → near-zero commands.
  See X86_MANUS_INTEGRATION.md section 4.
