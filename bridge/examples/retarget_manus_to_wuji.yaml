# Manus Ergonomics (degrees, typical) -> Wuji Hand 2 joints (radians)
# Copy to x86 and tune. Keys under each finger match Manus ErgonomicsDataType
# suffixes: MCPSpread / MCPStretch / PIPStretch / DIPStretch

left:
  # out[finger*4 + j]
  Thumb:  { J1: {src: MCPStretch, scale: 0.0174533, bias: 0.0},
            J2: {src: MCPSpread,  scale: 0.0174533, bias: 0.0},
            J3: {src: PIPStretch, scale: 0.0174533, bias: 0.0},
